name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tokens generate theme.css, which the app's styles import. Nothing
      # downstream typechecks or builds without this running first.
      - name: Build design tokens
        run: pnpm tokens

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The map silently failed to render for two releases: a CSS bundle-ordering
      # conflict collapsed its container while types, lint, unit tests and network
      # activity all stayed healthy. Only real layout measurement catches that.
      - name: Install Playwright browser
        run: pnpm --filter @hyzerlines/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @hyzerlines/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
