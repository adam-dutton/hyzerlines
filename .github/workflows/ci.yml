name: CI

on:
  # Deliberately every branch, not just main.
  #
  # With `branches: [main]` plus `pull_request`, a push to a feature branch with
  # no open PR matched neither trigger and ran no checks at all. That happened:
  # a fix was pushed after its PR had merged, sat completely unverified, and was
  # very nearly reported as landed. The concurrency group below cancels the
  # duplicate run when a PR is open, so the cost is a queued job, not a wasted one.
  push:
  pull_request:

# A newer push makes an in-flight run irrelevant.
#
# Keyed on the branch name rather than github.ref, because a push and a pull
# request on the same branch report different refs (`refs/heads/x` versus
# `refs/pull/N/merge`). Using the raw ref would put them in separate groups and
# run both — head_ref covers the PR case, ref_name the push.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tokens generate theme.css, which the app's styles import. Nothing
      # downstream typechecks or builds without this running first.
      - name: Build design tokens
        run: pnpm tokens

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The map silently failed to render for two releases: a CSS bundle-ordering
      # conflict collapsed its container while types, lint, unit tests and network
      # activity all stayed healthy. Only real layout measurement catches that.
      - name: Install Playwright browser
        run: pnpm --filter @hyzerlines/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @hyzerlines/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
